version: '3.8'

services:
  # ===================
  # MongoDB Database
  # ===================
  mongodb:
    image: mongo:7.0
    container_name: nabeeh-mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db
    networks:
      - nabeeh-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================
  # vLLM AI Engine (GPU)
  # ===================
  vllm:
    image: vllm/vllm-openai:latest
    container_name: nabeeh-vllm
    restart: always
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/root/.cache/huggingface
    command: >
      --model Qwen/Qwen2.5-32B-Instruct
      --tensor-parallel-size 4
      --gpu-memory-utilization 0.90
      --max-model-len 8192
      --port 8000
      --host 0.0.0.0
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    networks:
      - nabeeh-network
    healthcheck:
      test: curl -f http://localhost:8000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  # ===================
  # Backend (FastAPI)
  # ===================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nabeeh-backend
    restart: always
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=clinical_doc_center
      - VLLM_API_URL=http://vllm:8000/v1
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-key-in-production-2024}
      - CORS_ORIGINS=*
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@nabeeh.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@2024}
      - ADMIN_SECRET_CODE=CDI-ADMIN-2024
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - nabeeh-network
    healthcheck:
      test: curl -f http://localhost:8001/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================
  # Frontend (React)
  # ===================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=
    container_name: nabeeh-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - nabeeh-network

  # ===================
  # Nginx Reverse Proxy
  # ===================
  nginx:
    image: nginx:alpine
    container_name: nabeeh-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - nabeeh-network

networks:
  nabeeh-network:
    driver: bridge

volumes:
  mongodb_data:
  huggingface_cache:
